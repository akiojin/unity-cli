name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build every release asset (binaries, manifests, SHA256SUMS, Homebrew formula) without tagging, publishing, or releasing
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-tag:
    name: Create Tag & Release
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'chore(release):') || github.event_name == 'workflow_dispatch'
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      created: ${{ steps.check-tag.outputs.created }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
      build: ${{ steps.mode.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run skill contract lint
        run: cargo run --quiet -- skills lint --severity error --format text

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION="$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION, Tag: $TAG"

      - name: Check if tag already exists
        id: check-tag
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: no tag is created."
            echo "created=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists, skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve release mode
        id: mode
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          CREATED: ${{ steps.check-tag.outputs.created }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "build=${CREATED}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check-tag.outputs.created == 'true'
        run: |
          git tag -a "${{ steps.version.outputs.tag }}" -m "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Install git-cliff
        if: steps.check-tag.outputs.created == 'true'
        uses: kenji-miyake/setup-git-cliff@v2

      - name: Generate release notes
        if: steps.check-tag.outputs.created == 'true'
        id: release-notes
        run: |
          NOTES=$(git-cliff --latest --strip header 2>/dev/null || echo "Release ${{ steps.version.outputs.tag }}")
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.check-tag.outputs.created == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.release-notes.outputs.notes }}

  publish-crate:
    name: Publish to crates.io
    needs: create-tag
    if: needs.create-tag.outputs.created == 'true' && needs.create-tag.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-tag.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crate
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build:
    name: Build (${{ matrix.target }})
    needs: create-tag
    if: needs.create-tag.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: unity-cli-linux-x64
            binary: unity-cli
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact: unity-cli-linux-arm64
            binary: unity-cli
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: unity-cli-osx-arm64
            binary: unity-cli
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: unity-cli-osx-x64
            binary: unity-cli
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: unity-cli-win-x64
            binary: unity-cli.exe
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-tag.outputs.dry_run == 'true' && github.sha || needs.create-tag.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-build-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.artifact }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 1

  build-lsp:
    name: Build LSP (${{ matrix.rid }})
    needs: create-tag
    if: needs.create-tag.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            artifact: csharp-lsp-linux-x64
          - rid: linux-arm64
            os: ubuntu-latest
            artifact: csharp-lsp-linux-arm64
          - rid: osx-arm64
            os: macos-latest
            artifact: csharp-lsp-osx-arm64
          - rid: osx-x64
            os: macos-latest
            artifact: csharp-lsp-osx-x64
          - rid: win-x64
            os: windows-latest
            artifact: csharp-lsp-win-x64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-tag.outputs.dry_run == 'true' && github.sha || needs.create-tag.outputs.tag }}

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish LSP server
        run: >
          dotnet publish lsp/Server.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true

      - name: Rename artifact (Unix)
        if: runner.os != 'Windows'
        run: cp lsp/bin/Release/net10.0/${{ matrix.rid }}/publish/Server ${{ matrix.artifact }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item "lsp/bin/Release/net10.0/${{ matrix.rid }}/publish/Server.exe" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 1

  upload-release:
    name: Upload Release Assets
    needs: [create-tag, build, build-lsp]
    if: needs.create-tag.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-tag.outputs.dry_run == 'true' && github.sha || needs.create-tag.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate managed binary manifests
        env:
          TAG: ${{ needs.create-tag.outputs.tag }}
          VERSION: ${{ needs.create-tag.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          generate_manifest() {
            prefix="$1"
            output="$2"
            manifest="{\"version\":\"${VERSION}\",\"assets\":{"
            first=true
            for file in artifacts/${prefix}-*/${prefix}-*; do
              name="$(basename "$file")"
              rid="${name#${prefix}-}"
              sha="$(sha256sum "$file" | cut -d' ' -f1)"
              url="https://github.com/${REPO}/releases/download/${TAG}/${name}"
              if [ "$first" = true ]; then first=false; else manifest="${manifest},"; fi
              manifest="${manifest}\"${rid}\":{\"url\":\"${url}\",\"sha256\":\"${sha}\"}"
            done
            manifest="${manifest}}}"
            echo "$manifest" | python3 -m json.tool > "artifacts/${output}"
            echo "Generated ${output}:"
            cat "artifacts/${output}"
          }

          generate_manifest "unity-cli" "unity-cli-manifest.json"
          generate_manifest "csharp-lsp" "csharp-lsp-manifest.json"

      - name: Stage release assets and SHA256SUMS
        run: |
          mkdir -p release-assets
          for file in artifacts/unity-cli-*/unity-cli-* artifacts/csharp-lsp-*/csharp-lsp-*; do
            cp "$file" release-assets/
          done
          # winget portable installers need an .exe URL; same bytes as unity-cli-win-x64.
          cp release-assets/unity-cli-win-x64 release-assets/unity-cli-win-x64.exe
          cp artifacts/unity-cli-manifest.json artifacts/csharp-lsp-manifest.json release-assets/
          (cd release-assets && sha256sum -- * > SHA256SUMS)
          cat release-assets/SHA256SUMS
          for required in unity-cli-osx-arm64 unity-cli-osx-x64 unity-cli-linux-x64 unity-cli-linux-arm64 unity-cli-win-x64 unity-cli-win-x64.exe; do
            grep -q "  ${required}\$" release-assets/SHA256SUMS || { echo "missing ${required} in SHA256SUMS" >&2; exit 1; }
          done

      - name: Render Homebrew formula
        run: |
          scripts/release/render-homebrew-formula.sh \
            "${{ needs.create-tag.outputs.version }}" \
            release-assets/SHA256SUMS > unity-cli.rb
          ruby -c unity-cli.rb
          cat unity-cli.rb

      - name: Upload dry-run assets
        if: needs.create-tag.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: |
            release-assets/
            unity-cli.rb
          retention-days: 7

      - name: Upload assets to GitHub Release
        if: needs.create-tag.outputs.dry_run != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-tag.outputs.tag }}
          files: release-assets/*

      - name: Upload Homebrew formula for tap update
        if: needs.create-tag.outputs.dry_run != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: homebrew-formula
          path: unity-cli.rb
          retention-days: 1

  update-homebrew-tap:
    name: Update Homebrew tap (akiojin/tap)
    needs: [create-tag, upload-release]
    if: needs.create-tag.outputs.created == 'true' && needs.create-tag.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Skip when tap token is not configured
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping akiojin/homebrew-tap update."

      - name: Download Homebrew formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: homebrew-formula

      - name: Push formula to akiojin/homebrew-tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          VERSION: ${{ needs.create-tag.outputs.version }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/akiojin/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp unity-cli.rb tap/Formula/unity-cli.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/unity-cli.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git commit -m "unity-cli ${VERSION}"
          git push origin HEAD

  update-winget:
    name: Submit winget manifest (akiojin.unity-cli)
    needs: [create-tag, upload-release]
    if: needs.create-tag.outputs.created == 'true' && needs.create-tag.outputs.dry_run != 'true'
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Skip when winget token is not configured
        if: env.WINGET_TOKEN == ''
        run: echo "::notice::WINGET_TOKEN is not set; skipping winget-pkgs submission."

      - name: Submit update to microsoft/winget-pkgs
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: akiojin.unity-cli
          version: ${{ needs.create-tag.outputs.version }}
          release-tag: ${{ needs.create-tag.outputs.tag }}
          installers-regex: 'unity-cli-win-x64\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
