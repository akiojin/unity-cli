name: VFX Agent Eval

# Outcome eval for the unity-vfx-graph skill: can an agent BUILD the right graph from a
# natural-language prompt using only the skill? It is a DISCOVERY tool, not a gate — the runner
# always exits 0 (agent non-determinism), and failures are triaged into skill/docs fixes.
#
# This eval needs a live Unity Editor with the UnityCliBridge project open and a clean-room agent
# runtime, so it only runs when a runner is configured (secrets.VFX_AGENT_EVAL_AGENT_CMD) — normally
# on a self-hosted, Unity-equipped runner. Without the secret it cleanly skips.

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  vfx-agent-eval:
    name: VFX Agent Eval (nightly, opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run VFX agent eval (if configured)
        env:
          VFX_AGENT_EVAL_AGENT_CMD: ${{ secrets.VFX_AGENT_EVAL_AGENT_CMD }}
          VFX_AGENT_EVAL_UNITY_CLI: ${{ vars.VFX_AGENT_EVAL_UNITY_CLI }}
          VFX_AGENT_EVAL_MODEL: ${{ vars.VFX_AGENT_EVAL_MODEL }}
        run: |
          if [[ -z "${VFX_AGENT_EVAL_AGENT_CMD:-}" ]]; then
            echo "SKIP: secrets.VFX_AGENT_EVAL_AGENT_CMD is not set (needs a Unity-equipped runner + agent runtime)."
            exit 0
          fi
          ./scripts/vfx-agent-eval/vfx-agent-eval.sh \
            --agent-cmd "${VFX_AGENT_EVAL_AGENT_CMD}" \
            --unity-cli "${VFX_AGENT_EVAL_UNITY_CLI:-unity-cli}" \
            --model "${VFX_AGENT_EVAL_MODEL:-nightly}" \
            --json
      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vfx-agent-eval
          path: |
            .unity/vfx-agent-eval/summary.json
            .unity/vfx-agent-eval/history.jsonl
            tests/fixtures/vfx-agent-eval/benchmark.jsonl
          retention-days: 30
