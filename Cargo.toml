[package]
name = "unity-cli"
version = "0.15.3"
edition = "2021"
description = "Rust CLI for Unity Editor automation over the Unity TCP protocol"
readme = "README.md"
license = "MIT"
repository = "https://github.com/akiojin/unity-cli"
homepage = "https://github.com/akiojin/unity-cli"
documentation = "https://github.com/akiojin/unity-cli#readme"
keywords = ["unity", "cli", "automation", "editor"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[[bin]]
name = "unity-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
dirs = "7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "net", "io-util", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
regex = "1.12"
walkdir = "2.5"
sha2 = "0.11"
ureq = { version = "3.3", features = ["json"] }
serde_yml = "0.0.13"
similar = "3"
socket2 = "0.6"
zip = "8"
fastembed = { version = "6", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries"] }
# bincode 3.0.0 intentionally compile_error!s; retain the existing index format (#342).
bincode = "=1.3.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
lto = true
codegen-units = 1
strip = true
