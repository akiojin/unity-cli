[package]
name = "unity-cli"
version = "0.18.1"
edition = "2021"
description = "Rust CLI for Unity Editor automation over the Unity TCP protocol"
readme = "README.md"
license = "MIT"
repository = "https://github.com/akiojin/unity-cli"
homepage = "https://github.com/akiojin/unity-cli"
documentation = "https://github.com/akiojin/unity-cli#readme"
keywords = ["unity", "cli", "automation", "editor"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src/**",
    "/build.rs",
    "/.claude-plugin/plugins/unity-cli/skills/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[[bin]]
name = "unity-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
dirs = "7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "net", "io-util", "io-std", "rt-multi-thread", "time"] }
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
regex = "1.12"
walkdir = "2.5"
sha2 = "0.11"
ureq = { version = "3.3", features = ["json"] }
serde_yml = "0.0.13"
similar = "3"
tempfile = "3.27"
socket2 = "0.6"
zip = "8"
# bincode 3.0.0 intentionally compile_error!s; retain the existing index format (#342).
bincode = "=2.0.1"

# ONNX Runtime ships no prebuilt binaries for Intel macOS, so that target loads
# libonnxruntime dynamically at runtime (ORT_DYLIB_PATH / Homebrew onnxruntime).
[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
fastembed = { version = "7", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries"] }

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
fastembed = { version = "6", default-features = false, features = ["hf-hub-rustls-tls", "ort-load-dynamic"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
